name: CI

# El portero del repo. Nadie pasa a main sin pasar por acá.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si alguien pushea como loco, matamos los runs viejos — no vamos a
# quemar minutos en commits que ya están obsoletos.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache de NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar dependencias
        run: dotnet restore gard.slnx

      - name: Compilar (Release)
        run: dotnet build gard.slnx -c Release --no-restore

      - name: Tests (con reporte TRX)
        shell: bash
        run: |
          dotnet test gard.slnx -c Release --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --results-directory TestResults

      - name: Resumen de tests en el step summary
        if: always()
        shell: bash
        run: |
          echo "### Resultados de tests — ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          TRX=$(ls TestResults/*.trx 2>/dev/null | head -1 || true)
          if [ -n "$TRX" ]; then
            # Counters viene como <Counters total="X" passed="Y" failed="Z" ... />
            LINE=$(grep -o '<Counters[^/]*' "$TRX" | head -1)
            get() { echo "$LINE" | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*' || echo 0; }
            T=$(get total); P=$(get passed); F=$(get failed); S=$(get notExecuted)
            ICON="✅"; [ "${F:-0}" != "0" ] && ICON="❌"
            echo "$ICON **${P:-0}/${T:-0}** pasaron · ${F:-0} fallaron · ${S:-0} omitidos" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_(sin archivo .trx — los tests quizá ni corrieron)_" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir TRX (sólo si falla, para no llenar artifacts)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          retention-days: 7

  # El release intenta Native AOT y cae a self-contained con un warning: sin
  # este job una regresión AOT (reflexión, trimming) sólo aparecía al taguear.
  aot-smoke:
    name: Native AOT smoke (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Native AOT
        run: dotnet publish src/Gard.Cli/Gard.Cli.csproj -c Release -r linux-x64 -p:PublishAot=true -o out/aot

      - name: Smoke del binario nativo
        shell: bash
        run: |
          out/aot/gard --version
          out/aot/gard --help >/dev/null
          out/aot/gard doctor --plain >/dev/null
          out/aot/gard test --csv-header >/dev/null
          # Rechazo de opciones: debe salir con 2, no abortar.
          set +e; out/aot/gard --style fancy scan; CODE=$?; set -e
          [ "$CODE" -eq 2 ] || { echo "::error::exit $CODE esperado 2"; exit 1; }
          out/aot/gard completions bash | bash -n
          out/aot/gard doctor --json | python3 -c 'import json,sys; assert json.load(sys.stdin)["schema"]=="gard.doctor/1"'

      - name: Lint de instaladores
        run: shellcheck scripts/install.sh packaging/homebrew/render-formula.sh

      - name: install.sh contra un mirror local del binario recién compilado
        shell: bash
        run: |
          VER=$(dotnet msbuild src/Gard.Cli/Gard.Cli.csproj -getProperty:Version)
          NAME="gard-v${VER}-linux-x64"
          mkdir -p "mirror/v${VER}/$NAME"
          cp out/aot/gard "mirror/v${VER}/$NAME/"
          tar -C "mirror/v${VER}" -czf "mirror/v${VER}/$NAME.tar.gz" "$NAME"
          (cd "mirror/v${VER}" && sha256sum "$NAME.tar.gz" > SHA256SUMS)
          GARD_VERSION="$VER" GARD_DOWNLOAD_BASE="file://$PWD/mirror" GARD_INSTALL_DIR="$PWD/ibin" sh scripts/install.sh
          "$PWD/ibin/gard" --version | grep -q "gard $VER"

      - name: Fórmula Homebrew renderizable
        shell: bash
        run: |
          printf '%s  %s\n' a gard-v9.9.9-osx-arm64.tar.gz b gard-v9.9.9-osx-x64.tar.gz \
            c gard-v9.9.9-linux-x64.tar.gz d gard-v9.9.9-linux-arm64.tar.gz > sums
          packaging/homebrew/render-formula.sh 9.9.9 sums > gard.rb
          ruby -c gard.rb
          ! grep -q '__' gard.rb

  # pwsh no corre en los runners Linux con el mismo host que el usuario final:
  # el parseo se valida en Windows real.
  installer-windows:
    name: install.ps1 parsea (windows)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          Write-Host 'install.ps1 OK'
