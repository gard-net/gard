name: CI

# El portero del repo. Nadie pasa a main sin pasar por acá.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si alguien pushea como loco, matamos los runs viejos — no vamos a
# quemar minutos en commits que ya están obsoletos.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache de NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restaurar dependencias
        run: dotnet restore gard.slnx

      - name: Compilar (Release)
        run: dotnet build gard.slnx -c Release --no-restore

      - name: Tests (con reporte TRX)
        run: |
          dotnet test gard.slnx -c Release --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --results-directory TestResults

      - name: Resumen de tests en el step summary
        if: always()
        shell: bash
        run: |
          echo "### Resultados de tests — ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          TRX=$(ls TestResults/*.trx 2>/dev/null | head -1 || true)
          if [ -n "$TRX" ]; then
            # Counters viene como <Counters total="X" passed="Y" failed="Z" ... />
            LINE=$(grep -o '<Counters[^/]*' "$TRX" | head -1)
            get() { echo "$LINE" | grep -o "$1=\"[0-9]*\"" | grep -o '[0-9]*' || echo 0; }
            T=$(get total); P=$(get passed); F=$(get failed); S=$(get notExecuted)
            ICON="✅"; [ "${F:-0}" != "0" ] && ICON="❌"
            echo "$ICON **${P:-0}/${T:-0}** pasaron · ${F:-0} fallaron · ${S:-0} omitidos" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_(sin archivo .trx — los tests quizá ni corrieron)_" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Subir TRX (sólo si falla, para no llenar artifacts)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx
          retention-days: 7
