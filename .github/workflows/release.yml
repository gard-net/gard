name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0). Leave blank to use the current ref.'
        required: false

jobs:
  publish:
    name: publish ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar
          - os: macos-latest
            rid: osx-arm64
            archive: tar
          - os: macos-13
            rid: osx-x64
            archive: tar
          - os: windows-latest
            rid: win-x64
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: ver
        shell: bash
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${REF#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$REF"     >> "$GITHUB_OUTPUT"

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Gard.Cli/Gard.Cli.csproj \
            -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o ./out/${{ matrix.rid }}

      - name: Stage release dir
        shell: bash
        run: |
          DEST="gard-${{ steps.ver.outputs.tag }}-${{ matrix.rid }}"
          mkdir -p "dist/$DEST"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            cp out/${{ matrix.rid }}/gard.exe "dist/$DEST/"
          else
            cp out/${{ matrix.rid }}/gard "dist/$DEST/"
          fi
          cp README.md LICENSE LICENSE-docs "dist/$DEST/"
          cp -r docs "dist/$DEST/docs"
          echo "DEST=$DEST" >> "$GITHUB_ENV"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -C dist -czf "dist/${DEST}.tar.gz" "$DEST"

      - name: Build .deb (linux-x64 only)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          ROOT="debbuild/gard_${VER}_amd64"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/share/doc/gard"
          sed "s/__VERSION__/$VER/" packaging/debian/control.tmpl > "$ROOT/DEBIAN/control"
          install -m 0755 out/${{ matrix.rid }}/gard "$ROOT/usr/bin/gard"
          cp README.md LICENSE LICENSE-docs "$ROOT/usr/share/doc/gard/"
          dpkg-deb --build --root-owner-group "$ROOT" "dist/gard_${VER}_amd64.deb"

      - name: Upload .deb
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: gard-deb
          path: dist/*.deb

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:DEST" -DestinationPath "dist/$env:DEST.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gard-${{ matrix.rid }}
          path: dist/*.tar.gz
          if-no-files-found: ignore

      - name: Upload artifact (zip)
        if: matrix.archive == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: gard-${{ matrix.rid }}-zip
          path: dist/*.zip

  release:
    name: Publish GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -lah dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
