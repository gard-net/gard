name: Release

# De tag 'vX.Y.Z' a binarios self-contained + .deb + draft release.
# Si salís corriendo con 'git push --tags' sin querer, esto se va a
# ejecutar — avisado estás.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a buildear (ej. v0.2.0). Vacío = usa el ref actual.'
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # acá NO cancelamos: el release debe terminar sí o sí

jobs:
  publish:
    name: publicar ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            archive: tar
          - os: macos-latest
            rid: osx-arm64
            archive: tar
          # osx-x64 se cross-compila desde el runner arm64 (macos-latest).
          # El pool de macos-13 Intel está saturado/deprecado, así que
          # evitamos quedar encolados para siempre. `dotnet publish -r
          # osx-x64 --self-contained` produce un binario Intel nativo
          # válido para cualquier Mac Intel ≥10.15.
          - os: macos-latest
            rid: osx-x64
            archive: tar
          - os: windows-latest
            rid: win-x64
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache de NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Calcular versión
        id: ver
        shell: bash
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          VER="${REF#v}"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$REF"     >> "$GITHUB_OUTPUT"
          echo "→ buildeando $REF (version=$VER)"

      - name: Publish (self-contained, single-file)
        shell: bash
        run: |
          dotnet publish src/Gard.Cli/Gard.Cli.csproj \
            -c Release -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.ver.outputs.version }} \
            -o ./out/${{ matrix.rid }}

      - name: Armar carpeta de release
        shell: bash
        run: |
          DEST="gard-${{ steps.ver.outputs.tag }}-${{ matrix.rid }}"
          mkdir -p "dist/$DEST"
          if [ "${{ matrix.rid }}" = "win-x64" ]; then
            cp out/${{ matrix.rid }}/gard.exe "dist/$DEST/"
          else
            cp out/${{ matrix.rid }}/gard "dist/$DEST/"
          fi
          cp README.md LICENSE LICENSE-docs "dist/$DEST/"
          cp -r docs "dist/$DEST/docs"
          echo "DEST=$DEST" >> "$GITHUB_ENV"

      - name: Empaquetar (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: tar -C dist -czf "dist/${DEST}.tar.gz" "$DEST"

      - name: Build .deb (sólo linux-x64)
        if: matrix.rid == 'linux-x64'
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          ROOT="debbuild/gard_${VER}_amd64"
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/usr/share/doc/gard"
          sed "s/__VERSION__/$VER/" packaging/debian/control.tmpl > "$ROOT/DEBIAN/control"
          install -m 0755 out/${{ matrix.rid }}/gard "$ROOT/usr/bin/gard"
          cp README.md LICENSE LICENSE-docs "$ROOT/usr/share/doc/gard/"
          dpkg-deb --build --root-owner-group "$ROOT" "dist/gard_${VER}_amd64.deb"

      - name: Empaquetar (zip, Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:DEST" -DestinationPath "dist/$env:DEST.zip"

      - name: Checksums SHA256 (por plataforma)
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then
            SUM=sha256sum
          else
            SUM="shasum -a 256"
          fi
          for f in *.tar.gz *.zip *.deb; do
            [ -f "$f" ] || continue
            $SUM "$f" > "${f}.sha256"
          done
          echo "### Artefactos — ${{ matrix.rid }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '| archivo | tamaño | sha256 |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---:|---|' >> "$GITHUB_STEP_SUMMARY"
          for f in *.tar.gz *.zip *.deb; do
            [ -f "$f" ] || continue
            SZ=$(du -h "$f" | cut -f1)
            HASH=$(cut -d' ' -f1 "${f}.sha256")
            echo "| \`$f\` | $SZ | \`${HASH:0:16}…\` |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Subir .deb
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v4
        with:
          name: gard-deb
          path: |
            dist/*.deb
            dist/*.deb.sha256

      - name: Subir tar.gz
        uses: actions/upload-artifact@v4
        with:
          name: gard-${{ matrix.rid }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: ignore

      - name: Subir zip (Windows)
        if: matrix.archive == 'zip'
        uses: actions/upload-artifact@v4
        with:
          name: gard-${{ matrix.rid }}-zip
          path: |
            dist/*.zip
            dist/*.zip.sha256

  release:
    name: Crear GitHub Release (draft)
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bajar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS consolidado
        shell: bash
        run: |
          cd dist
          # Unimos todos los .sha256 individuales en un solo archivo.
          if ls *.sha256 >/dev/null 2>&1; then
            cat *.sha256 | sort > SHA256SUMS
            rm -f *.sha256
          fi
          ls -lah

      - name: Resumen del release
        shell: bash
        run: |
          echo "### Release — ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "El release queda como **draft** — revisá, agregá notas y publicalo a mano." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          (cd dist && ls -lah) >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Crear GitHub Release (draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/SHA256SUMS
